<!doctype html><html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Refunder · Autonomous Governance & Arbitration</title>
  
    <!-- Reliable production CDNs for single file HTML -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    :root {
      --bg: #080a0f;
      --panel: rgba(18, 21, 29, 0.72);
      --panelStrong: #121620;
      --ink: #f2f5f7;
      --muted: #929aa7;
      --line: rgba(255, 255, 255, 0.12);
      --accent: #5d8dff;
      --accentGlow: rgba(93, 141, 255, 0.28);
      --signalGreen: #4ade80;
      --signalAmber: #fbbf24;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); scroll-behavior: smooth; }
    body {
      min-width: 320px;
      margin: 0;
      background: radial-gradient(circle at var(--mx, 76%) var(--my, 16%), color-mix(in srgb, var(--accent) 16%, transparent), transparent 34%), var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    button, a, input, select, textarea { font: inherit; color: inherit; }
    button {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 18px;
      background: var(--panel);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      transition: border-color 0.2s, background 0.2s, transform 0.1s;
    }
    button:hover {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, var(--panelStrong));
    }
    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accentGlow);
    }
    button.primary:hover {
      background: color-mix(in srgb, var(--accent) 85%, #fff);
      box-shadow: 0 0 28px var(--accent);
    }
    .shell {
      width: min(1340px, calc(100% - 48px));
      margin: auto;
      padding: 24px 0 48px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0 24px;
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.08em;
    }
    .brand i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 20px var(--accent);
    }
    .nav-tabs {
      display: flex;
      gap: 6px;
      background: rgba(18, 22, 32, 0.8);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }
    .nav-tabs button {
      border: none;
      background: transparent;
      padding: 8px 18px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .nav-tabs button.active {
      background: var(--panelStrong);
      color: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .nav-tabs button:hover:not(.active) {
      color: var(--ink);
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(280px, .6fr);
      gap: 40px;
      align-items: end;
      padding: 40px 0 32px;
    }
    .intro small {
      display: block;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-family: monospace;
    }
    .intro h1 {
      margin: 0;
      font-size: clamp(34px, 4.5vw, 64px);
      font-weight: 650;
      letter-spacing: -.05em;
      line-height: .95;
    }
    .intro p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    /* Glass Container Shell */
    .glass-shell {
      position: relative;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.015));
      border: 1px solid var(--line);
      border-radius: 24px;
      backdrop-filter: blur(28px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 24px 60px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    .glass-shell::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    }

    /* Form Elements */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      font-family: monospace;
    }
    .field-input {
      width: 100%;
      background: rgba(10, 14, 22, 0.85);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s;
    }
    .field-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
    }

    /* Markdown styling */
    .markdown-body h1 { font-size: 1.35rem; font-weight: 800; color: #fff; margin-bottom: 0.75rem; }
    .markdown-body h2 { font-size: 1.15rem; font-weight: 700; color: #e2e8f0; margin-top: 1.25rem; margin-bottom: 0.5rem; }
    .markdown-body h3 { font-size: 1rem; font-weight: 600; color: #cbd5e1; margin-top: 0.75rem; margin-bottom: 0.25rem; }
    .markdown-body p { margin-bottom: 0.65rem; line-height: 1.6; color: var(--muted); font-size: 0.85rem; }
    .markdown-body ul, .markdown-body ol { margin-left: 1.25rem; margin-bottom: 0.65rem; color: var(--muted); font-size: 0.85rem; }
    .markdown-body li { margin-bottom: 0.2rem; }
    .markdown-body table { width: 100%; border-collapse: collapse; margin-bottom: 0.75rem; font-size: 0.8rem; }
    .markdown-body th, .markdown-body td { border: 1px solid var(--line); padding: 0.5rem 0.75rem; text-align: left; }
    .markdown-body th { background-color: var(--panelStrong); color: #f1f5f9; font-weight: 600; }
    .markdown-body td { color: #cbd5e1; }
    .markdown-body blockquote { border-left: 3px solid var(--accent); padding-left: 0.75rem; color: #c7d2fe; margin-bottom: 0.75rem; font-style: italic; background: rgba(93, 141, 255, 0.08); padding-top: 0.4rem; padding-bottom: 0.4rem; border-radius: 0 8px 8px 0; font-size: 0.85rem; }
    .markdown-body hr { border-color: var(--line); margin: 1.25rem 0; }

    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.15); border-radius: 999px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">

    const { useState, useEffect, useRef } = React;

    function App() {
      // 4 Ordered Navigation Tabs:
      // 1. 'introduction'
      // 2. 'policy'
      // 3. 'refund_request'
      // 4. 'evaluate_suite'
      const [activeTab, setActiveTab] = useState('introduction');

      // --- TAB 1: POLICY STATE ---
      const [policyText, setPolicyText] = useState("");
      const [policyMeta, setPolicyMeta] = useState(null);
      const [policyLoading, setPolicyLoading] = useState(false);
      const [policySuccessMsg, setPolicySuccessMsg] = useState("");
      const [isEditingPolicy, setIsEditingPolicy] = useState(false);
      const fileInputRef = useRef(null);

      // --- TAB 2: REFUND REQUEST STATE ---
      const [refundForm, setRefundForm] = useState({
        employee_name: "",
        employee_id: "",
        approver_id: "",
        category: "meal",
        amount: "",
        description: "",
        days_since_expense: 1
      });
      const [refundReceiptFile, setRefundReceiptFile] = useState(null);
      const [refundReceiptPreview, setRefundReceiptPreview] = useState(null);
      const [refundLoading, setRefundLoading] = useState(false);
      const [refundResult, setRefundResult] = useState(null);

      // --- TAB 3: EVALUATE TESTCASE (Starts with 0 items, Add button below) ---
      const [testcases, setTestcases] = useState([]);

      // Fetch pre-existing policy.md on load
      useEffect(() => {
        const fetchInitialPolicy = async () => {
          try {
            const res = await fetch("/api/policy");
            if (res.ok) {
              const data = await res.json();
              if (data.content) {
                setPolicyText(data.content);
                setPolicyMeta({ filename: data.filename || "policy.md", size: `${(data.content.length / 1024).toFixed(1)} KB` });
                return;
              }
            }
            const staticRes = await fetch("./policy.md");
            if (staticRes.ok) {
              const text = await staticRes.text();
              if (text && text.trim().startsWith("#")) {
                setPolicyText(text);
                setPolicyMeta({ filename: "policy.md", size: `${(text.length / 1024).toFixed(1)} KB` });
              }
            }
          } catch (e) {}
        };
        fetchInitialPolicy();
      }, []);

      // Core Evaluation Helper
      const runEvaluation = async (claimData, hasReceipt) => {
        try {
          const res = await fetch("/api/claims/evaluate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ...claimData, has_receipt: hasReceipt })
          });
          if (res.ok) return await res.json();
        } catch (err) {}

        await new Promise((r) => setTimeout(r, 400));
        const amount = parseFloat(claimData.amount || 0);
        const desc = (claimData.description || "").toLowerCase();

        if (desc.includes("blurry") || desc.includes("missing") || desc.includes("unreadable") || desc.includes("mờ")) {
          return {
            decision: "ESCALATE",
            target_role: "Employee / Accounts Payable",
            uncertainty_category: "UNCERTAIN_FACTS",
            reason: "The receipt amount is unreadable or blurry. The exact figure cannot be verified.",
            escalation_question: `The receipt for '${claimData.description}' is blurry at the total amount line. Is the actual paid amount $${amount.toFixed(2)} or $${(amount * 1.07).toFixed(2)}?`,
            policy_reference: "Article 3.4: Valid receipts & questionable data handling"
          };
        } else if (amount > 5000) {
          return {
            decision: "ESCALATE",
            target_role: "Procurement",
            uncertainty_category: "AUTHORITY_LIMIT",
            reason: `Single purchase of $${amount.toLocaleString()} exceeds the $5,000 threshold and must be routed to Procurement.`,
            escalation_question: `The equipment purchase '${claimData.description}' totals $${amount.toLocaleString()} (> $5,000). Should this be routed to Procurement for centralized purchasing or has prior contract approval been obtained?`,
            policy_reference: "Article 4.4 & Article 13: Transactions > $5,000 must be handled via Procurement"
          };
        } else if (desc.includes("alcohol") || desc.includes("wine") || desc.includes("beer") || desc.includes("gift card") || desc.includes("rượu")) {
          return {
            decision: "ESCALATE",
            target_role: "Direct Manager",
            uncertainty_category: "POLICY_EXCEPTION",
            reason: "The expense includes alcoholic beverages or out-of-policy items requiring exception review.",
            escalation_question: `The expense '${claimData.description}' ($${amount.toFixed(2)}) includes alcoholic beverages/gifts. Does the manager approve this as an authorized business entertainment exception?`,
            policy_reference: "Article 8.4 & Article 19: Business meals & out-of-policy exceptions"
          };
        } else if (claimData.days_since_expense > 30) {
          return {
            decision: "ESCALATE",
            target_role: "Direct Manager",
            uncertainty_category: "POLICY_EXCEPTION",
            reason: `Expense claim submitted overdue (${claimData.days_since_expense} days > 30 days limit).`,
            escalation_question: `The claim is submitted past the 30-day window (${claimData.days_since_expense} days since incurred). Does the manager approve an overdue policy exception?`,
            policy_reference: "Article 3.5: Submission deadline within 30 days"
          };
        } else if (claimData.approver_id && claimData.approver_id === claimData.employee_id) {
          return {
            decision: "ESCALATE",
            target_role: "Direct Manager",
            uncertainty_category: "AUTHORITY_LIMIT",
            reason: "The requester is self-approving their own expense claim.",
            escalation_question: `The designated approver is identical to the requester (${claimData.employee_name}). Can a qualified supervisor be assigned to review this claim?`,
            policy_reference: "Article 3.6 & Article 17: Requester ≠ Approver rule"
          };
        } else {
          return {
            decision: "APPROVE",
            target_role: "System Automated (ERP Accounting)",
            uncertainty_category: "NONE",
            reason: "The claim is fully compliant, receipt verified, and well within standard policy limits.",
            escalation_question: null,
            policy_reference: "Article 5: Standard expense limits (e.g. Individual meals ≤ $120/day)"
          };
        }
      };

      // Policy file import
      const handlePolicyFileChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          setPolicyLoading(true);
          const reader = new FileReader();
          reader.onload = async (event) => {
            const content = event.target.result;
            setPolicyText(content);
            const meta = {
              filename: file.name,
              size: `${(file.size / 1024).toFixed(1)} KB`,
              imported_at: new Date().toLocaleTimeString()
            };
            setPolicyMeta(meta);
            try {
              await fetch("/api/policy/import", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ filename: file.name, content: content })
              });
            } catch (err) {}
            setPolicySuccessMsg(`Imported "${file.name}"!`);
            setPolicyLoading(false);
            setTimeout(() => setPolicySuccessMsg(""), 3000);
          };
          reader.readAsText(file);
        }
      };

      // Save policy edits
      const handleSavePolicyText = async () => {
        if (!policyText.trim()) return;
        setPolicyLoading(true);
        const meta = {
          filename: policyMeta?.filename || "custom_policy.md",
          size: `${(policyText.length / 1024).toFixed(1)} KB`,
          imported_at: new Date().toLocaleTimeString()
        };
        setPolicyMeta(meta);
        try {
          await fetch("/api/policy/import", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ filename: meta.filename, content: policyText })
          });
        } catch (e) {}
        setIsEditingPolicy(false);
        setPolicySuccessMsg("Policy updated successfully!");
        setPolicyLoading(false);
        setTimeout(() => setPolicySuccessMsg(""), 3000);
      };

      // Refund request submit
      const handleRefundSubmit = async (e) => {
        e.preventDefault();
        setRefundLoading(true);
        setRefundResult(null);
        const evalRes = await runEvaluation(refundForm, !!refundReceiptPreview);
        setRefundResult(evalRes);
        setRefundLoading(false);
      };

      // Add Testcase Bar
      const handleAddTestcase = () => {
        const count = testcases.length + 1;
        const newId = `TC-0${count}`;
        setTestcases(prev => [
          ...prev,
          {
            id: newId,
            title: `Test Case ${newId}`,
            expanded: true,
            formData: {
              employee_name: "",
              employee_id: "",
              approver_id: "",
              category: "meal",
              amount: "",
              description: "",
              days_since_expense: 1
            },
            receiptPreview: null,
            loading: false,
            result: null
          }
        ]);
      };

      // Update testcase field
      const updateTestcaseField = (index, field, val) => {
        setTestcases(prev => prev.map((tc, idx) => idx === index ? { ...tc, formData: { ...tc.formData, [field]: val } } : tc));
      };

      // Toggle Bar
      const toggleTestcaseBar = (index) => {
        setTestcases(prev => prev.map((tc, idx) => idx === index ? { ...tc, expanded: !tc.expanded } : tc));
      };

      // Evaluate Bar
      const handleEvaluateTestcaseBar = async (index) => {
        const target = testcases[index];
        setTestcases(prev => prev.map((tc, idx) => idx === index ? { ...tc, loading: true, result: null } : tc));
        const res = await runEvaluation(target.formData, !!target.receiptPreview);
        setTestcases(prev => prev.map((tc, idx) => idx === index ? { ...tc, loading: false, result: res } : tc));
      };

      return (
        <main className="shell">
          {/* Topbar: Left Logo + Web Name, Right 4 Tabs */}
          <header className="topbar">
            <div className="brand">
              <div style={{
                width: '32px',
                height: '32px',
                borderRadius: '8px',
                background: 'rgba(93, 141, 255, 0.1)',
                border: '1px solid rgba(93, 141, 255, 0.3)',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                boxShadow: '0 0 12px rgba(93, 141, 255, 0.15)',
                color: 'var(--accent)'
              }}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
                </svg>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column' }}>
                <span style={{ fontSize: '15px', fontWeight: 800, letterSpacing: '0.04em', color: '#fff' }}>
                  Refunder
                </span>
                <span style={{ fontSize: '9px', letterSpacing: '0.12em', color: 'var(--muted)', fontFamily: 'monospace' }}>
                  AUTONOMOUS GOVERNANCE & ARBITRATION
                </span>
              </div>
            </div>

            {/* Navigation Tabs on the right */}
            <nav className="nav-tabs" aria-label="System Sections">
              <button
                type="button"
                onClick={() => setActiveTab('introduction')}
                className={activeTab === 'introduction' ? 'active' : ''}
              >
                <i className="fa-solid fa-compass" style={{ marginRight: '6px' }}></i>
                Introduction
              </button>
              <button
                type="button"
                onClick={() => setActiveTab('policy')}
                className={activeTab === 'policy' ? 'active' : ''}
              >
                <i className="fa-solid fa-book-bookmark" style={{ marginRight: '6px' }}></i>
                Company Policy
              </button>
              <button
                type="button"
                onClick={() => setActiveTab('refund_request')}
                className={activeTab === 'refund_request' ? 'active' : ''}
              >
                <i className="fa-solid fa-receipt" style={{ marginRight: '6px' }}></i>
                Refund Request
              </button>
              <button
                type="button"
                onClick={() => setActiveTab('evaluate_suite')}
                className={activeTab === 'evaluate_suite' ? 'active' : ''}
              >
                <i className="fa-solid fa-vial-circle-check" style={{ marginRight: '6px' }}></i>
                Evaluate Testcase ({testcases.length})
              </button>
            </nav>
          </header>

          <div style={{ height: '24px' }}></div>

          {/* ================= VIEW 0: INTRODUCTION ================= */}
          {activeTab === 'introduction' && (
            <div style={{
              display: 'flex',
              flexDirection: 'column',
              alignItems: 'center',
              justifyContent: 'center',
              textAlign: 'center',
              minHeight: '55vh',
              padding: '60px 20px',
              maxWidth: '720px',
              margin: '0 auto'
            }}>
              <h1 style={{
                fontSize: 'clamp(44px, 6vw, 68px)',
                fontWeight: 800,
                letterSpacing: '-0.04em',
                color: '#fff',
                lineHeight: 1.05,
                margin: '0 0 20px 0'
              }}>
                Refunder
              </h1>
              <p style={{
                fontSize: '16px',
                color: 'var(--muted)',
                lineHeight: 1.7,
                margin: 0,
                maxWidth: '640px'
              }}>
                An autonomous AI governance system that evaluates expense claims, validates compliance against operational regulations, and accurately routes ambiguous or high-risk claims to designated human decision-makers.
              </p>
            </div>
          )}

          {/* ================= VIEW 1: COMPANY POLICY ================= */}
          {activeTab === 'policy' && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: '24px' }}>
              {/* Controls bar */}
              <div className="glass-shell" style={{ padding: '20px 28px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '16px' }}>
                <div>
                  <div style={{ fontSize: '13px', fontWeight: 700, color: '#fff', marginBottom: '4px' }}>
                    Active Governance Regulations
                  </div>
                  <div style={{ fontSize: '11px', color: 'var(--muted)', fontFamily: 'monospace' }}>
                    {policyMeta ? `${policyMeta.filename} · ${policyMeta.size}` : "Default corporate expense policy"}
                  </div>
                </div>

                <div style={{ display: 'flex', gap: '10px' }}>
                  <input type="file" ref={fileInputRef} accept=".md,.txt,.json,.markdown" onChange={handlePolicyFileChange} style={{ display: 'none' }} />
                  <button type="button" onClick={() => fileInputRef.current && fileInputRef.current.click()} className="primary">
                    <i className="fa-solid fa-cloud-arrow-up"></i>
                    <span>Import Policy (.md)</span>
                  </button>
                  {policyText && (
                    <button type="button" onClick={() => setIsEditingPolicy(!isEditingPolicy)}>
                      <i className="fa-solid fa-pen-to-square"></i>
                      <span>{isEditingPolicy ? 'View Rendered' : 'Edit Source'}</span>
                    </button>
                  )}
                </div>
              </div>

              {policySuccessMsg && (
                <div style={{ padding: '12px 18px', background: 'rgba(74, 222, 128, 0.1)', border: '1px solid rgba(74, 222, 128, 0.3)', borderRadius: '12px', fontSize: '12px', color: 'var(--signalGreen)' }}>
                  ✓ {policySuccessMsg}
                </div>
              )}

              {/* Policy Body */}
              <div className="glass-shell" style={{ padding: '28px' }}>
                {!policyText ? (
                  <div style={{ padding: '80px 20px', textAlign: 'center', color: 'var(--muted)' }}>
                    <i className="fa-solid fa-book-open" style={{ fontSize: '36px', marginBottom: '16px', opacity: 0.4 }}></i>
                    <div style={{ fontWeight: 600, color: '#fff', marginBottom: '6px' }}>No Policy Loaded</div>
                    <div style={{ fontSize: '12px' }}>Click "Import Policy (.md)" above to load your regulation file.</div>
                  </div>
                ) : isEditingPolicy ? (
                  <div>
                    <textarea
                      rows={20}
                      className="field-input custom-scrollbar"
                      style={{ fontFamily: 'monospace', fontSize: '12px', lineHeight: 1.6 }}
                      value={policyText}
                      onChange={e => setPolicyText(e.target.value)}
                    />
                    <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '10px', marginTop: '16px' }}>
                      <button type="button" onClick={() => setIsEditingPolicy(false)}>Cancel</button>
                      <button type="button" onClick={handleSavePolicyText} className="primary">Save Changes</button>
                    </div>
                  </div>
                ) : (
                  <div className="markdown-body custom-scrollbar" style={{ maxHeight: '640px', overflowY: 'auto' }} dangerouslySetInnerHTML={{ __html: marked.parse(policyText) }} />
                )}
              </div>
            </div>
          )}

          {/* ================= VIEW 2: REFUND REQUEST ================= */}
          {activeTab === 'refund_request' && (
            <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0, 1.25fr) minmax(320px, 0.95fr)', gap: '28px', alignItems: 'stretch' }}>
              
              {/* Form Card */}
              <div className="glass-shell" style={{ padding: '32px', display: 'flex', flexDirection: 'column', height: '100%' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingBottom: '16px', marginBottom: '24px', borderBottom: '1px solid var(--line)' }}>
                  <div>
                    <div style={{ fontSize: '14px', fontWeight: 700, color: '#fff' }}>Submit Refund Claim</div>
                    <div style={{ fontSize: '11px', color: 'var(--muted)' }}>Fill claim information and upload receipt</div>
                  </div>
                  <span style={{ fontSize: '10px', fontFamily: 'monospace', color: 'var(--accent)', background: 'rgba(93, 141, 255, 0.1)', padding: '4px 8px', borderRadius: '6px' }}>
                    POST /api/claims/evaluate
                  </span>
                </div>

                <form onSubmit={handleRefundSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '18px' }}>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                    <div className="field-group">
                      <label className="field-label">Employee Name</label>
                      <input
                        type="text"
                        className="field-input"
                        placeholder="Alex Johnson"
                        value={refundForm.employee_name}
                        onChange={e => setRefundForm({ ...refundForm, employee_name: e.target.value })}
                        required
                      />
                    </div>
                    <div className="field-group">
                      <label className="field-label">Employee ID</label>
                      <input
                        type="text"
                        className="field-input"
                        placeholder="EMP-1001"
                        value={refundForm.employee_id}
                        onChange={e => setRefundForm({ ...refundForm, employee_id: e.target.value })}
                        required
                      />
                    </div>
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                    <div className="field-group">
                      <label className="field-label">Approver ID (Optional)</label>
                      <input
                        type="text"
                        className="field-input"
                        placeholder="MGR-2001"
                        value={refundForm.approver_id}
                        onChange={e => setRefundForm({ ...refundForm, approver_id: e.target.value })}
                      />
                    </div>
                    <div className="field-group">
                      <label className="field-label">Days Since Incurred</label>
                      <input
                        type="number"
                        className="field-input"
                        placeholder="3"
                        value={refundForm.days_since_expense}
                        onChange={e => setRefundForm({ ...refundForm, days_since_expense: parseInt(e.target.value) || 0 })}
                      />
                    </div>
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                    <div className="field-group">
                      <label className="field-label">Expense Category</label>
                      <select
                        className="field-input"
                        value={refundForm.category}
                        onChange={e => setRefundForm({ ...refundForm, category: e.target.value })}
                      >
                        <option value="meal">Meals & Entertainment</option>
                        <option value="hotel">Hotel & Lodging</option>
                        <option value="flight">Airfare & Travel</option>
                        <option value="ride">Local Transportation / Taxi</option>
                        <option value="equipment">Equipment & Hardware</option>
                        <option value="coworking">Coworking Space</option>
                        <option value="other">Other</option>
                      </select>
                    </div>
                    <div className="field-group">
                      <label className="field-label">Amount (USD)</label>
                      <input
                        type="number"
                        step="any"
                        className="field-input"
                        style={{ fontWeight: 700 }}
                        placeholder="120.00"
                        value={refundForm.amount}
                        onChange={e => setRefundForm({ ...refundForm, amount: e.target.value })}
                        required
                      />
                    </div>
                  </div>

                  <div className="field-group">
                    <label className="field-label">Description / Business Purpose</label>
                    <input
                      type="text"
                      className="field-input"
                      placeholder="e.g. Lunch with client partner to review deliverables"
                      value={refundForm.description}
                      onChange={e => setRefundForm({ ...refundForm, description: e.target.value })}
                      required
                    />
                  </div>

                  <div className="field-group" style={{ paddingTop: '8px' }}>
                    <label className="field-label">Receipt Image Proof</label>
                    <div style={{ display: 'flex', gap: '14px', alignItems: 'center' }}>
                      <label style={{ flex: 1, border: '1px dashed var(--line)', padding: '16px', borderRadius: '12px', background: 'rgba(10, 14, 22, 0.6)', cursor: 'pointer', textAlign: 'center' }}>
                        <i className="fa-solid fa-cloud-arrow-up" style={{ color: 'var(--muted)', marginBottom: '4px', display: 'block' }}></i>
                        <span style={{ fontSize: '11px', color: 'var(--ink)' }}>Upload receipt image</span>
                        <input
                          type="file"
                          accept="image/*"
                          onChange={e => {
                            const file = e.target.files[0];
                            if (file) {
                              setRefundReceiptFile(file);
                              const reader = new FileReader();
                              reader.onloadend = () => setRefundReceiptPreview(reader.result);
                              reader.readAsDataURL(file);
                            }
                          }}
                          style={{ display: 'none' }}
                        />
                      </label>
                      {refundReceiptPreview && (
                        <div style={{ position: 'relative', width: '70px', height: '70px', borderRadius: '10px', overflow: 'hidden', border: '1px solid var(--line)' }}>
                          <img src={refundReceiptPreview} alt="Receipt" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                          <button
                            type="button"
                            onClick={() => { setRefundReceiptFile(null); setRefundReceiptPreview(null); }}
                            style={{ position: 'absolute', top: '3px', right: '3px', padding: '2px 5px', fontSize: '8px' }}
                          >✕</button>
                        </div>
                      )}
                    </div>
                  </div>

                  <button type="submit" disabled={refundLoading} className="primary" style={{ justifyContent: 'center', padding: '14px', marginTop: '10px' }}>
                    <i className={`fa-solid fa-paper-plane ${refundLoading ? 'fa-spin' : ''}`}></i>
                    <span>{refundLoading ? 'Evaluating with Policy...' : 'Evaluate Refund Request'}</span>
                  </button>
                </form>
              </div>

              {/* Evaluation Result Card */}
              <div className="glass-shell" style={{ padding: '32px', height: '100%', display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
                <div style={{ display: 'flex', flexDirection: 'column', flex: 1 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingBottom: '16px', marginBottom: '24px', borderBottom: '1px solid var(--line)' }}>
                    <div style={{ fontSize: '14px', fontWeight: 700, color: '#fff' }}>Diagnostic Output</div>
                    <span style={{ fontSize: '10px', fontFamily: 'monospace', color: 'var(--muted)' }}>VERDICT</span>
                  </div>

                  {!refundResult ? (
                    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '40px 20px', textAlign: 'center', color: 'var(--muted)' }}>
                      <i className="fa-solid fa-inbox" style={{ fontSize: '36px', opacity: 0.3, marginBottom: '16px' }}></i>
                      <div style={{ fontSize: '14px', fontWeight: 600, color: '#fff', marginBottom: '6px' }}>Awaiting Request</div>
                      <div style={{ fontSize: '12px', maxWidth: '280px', lineHeight: 1.5 }}>Fill the form and submit to receive autonomous arbitration.</div>
                    </div>
                  ) : (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                      {/* Decision pill */}
                      <div style={{
                        padding: '16px',
                        borderRadius: '16px',
                        background: refundResult.decision === 'APPROVE' ? 'rgba(74, 222, 128, 0.08)' : 'rgba(251, 191, 36, 0.08)',
                        border: `1px solid ${refundResult.decision === 'APPROVE' ? 'rgba(74, 222, 128, 0.3)' : 'rgba(251, 191, 36, 0.3)'}`
                      }}>
                        <div style={{ fontSize: '10px', textTransform: 'uppercase', letterSpacing: '.12em', color: 'var(--muted)', fontFamily: 'monospace' }}>Decision</div>
                        <div style={{ fontSize: '20px', fontWeight: 800, marginTop: '4px', color: refundResult.decision === 'APPROVE' ? 'var(--signalGreen)' : 'var(--signalAmber)' }}>
                          {refundResult.decision === 'APPROVE' ? '✓ APPROVE (AUTOMATED)' : '⚠ ESCALATE'}
                        </div>
                      </div>

                      {/* Target Role */}
                      <div style={{ padding: '16px', borderRadius: '16px', background: 'rgba(18, 22, 32, 0.6)', border: '1px solid var(--line)' }}>
                        <div style={{ fontSize: '10px', textTransform: 'uppercase', letterSpacing: '.12em', color: 'var(--muted)', fontFamily: 'monospace' }}>Pass to Role</div>
                        <div style={{ fontSize: '15px', fontWeight: 700, color: 'var(--accent)', marginTop: '4px' }}>
                          {refundResult.target_role}
                        </div>
                      </div>

                      {/* Escalation Question */}
                      {refundResult.escalation_question && (
                        <div style={{ padding: '16px', borderRadius: '16px', background: 'rgba(251, 191, 36, 0.06)', border: '1px solid rgba(251, 191, 36, 0.2)' }}>
                          <div style={{ fontSize: '10px', textTransform: 'uppercase', letterSpacing: '.12em', color: 'var(--signalAmber)', fontFamily: 'monospace', marginBottom: '6px' }}>
                            Arbitration Question
                          </div>
                          <div style={{ fontSize: '12px', color: '#fef3c7', lineHeight: 1.5 }}>
                            "{refundResult.escalation_question}"
                          </div>
                        </div>
                      )}

                      {/* Reason & Reference */}
                      <div style={{ padding: '14px', borderRadius: '14px', background: 'rgba(10, 14, 22, 0.5)', border: '1px solid var(--line)', fontSize: '12px', display: 'flex', flexDirection: 'column', gap: '6px' }}>
                        <div><strong style={{ color: '#fff' }}>Reason:</strong> {refundResult.reason}</div>
                        <div style={{ fontFamily: 'monospace', fontSize: '10px', color: 'var(--muted)' }}>
                          <strong>Policy Ref:</strong> {refundResult.policy_reference}
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                <div style={{ paddingTop: '16px', borderTop: '1px solid var(--line)', fontSize: '10px', color: 'var(--muted)', display: 'flex', justifyContent: 'space-between', fontFamily: 'monospace' }}>
                  <span>Refunder</span>
                  <span>Active Engine: FIN-EXP-001</span>
                </div>
              </div>

            </div>
          )}

          {/* ================= VIEW 3: EVALUATE TESTCASE (Expandable Bars) ================= */}
          {activeTab === 'evaluate_suite' && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
              
              {/* Top Banner */}
              <div className="glass-shell" style={{ padding: '20px 28px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <div>
                  <div style={{ fontSize: '14px', fontWeight: 700, color: '#fff' }}>Evaluation Suite</div>
                  <div style={{ fontSize: '11px', color: 'var(--muted)', marginTop: '2px' }}>
                    Type inputs directly into testcase bars to stress-test escalation boundaries.
                  </div>
                </div>

                <div style={{ display: 'flex', alignItems: 'center', gap: '8px', fontSize: '11px', fontFamily: 'monospace' }}>
                  <span style={{ color: 'var(--muted)' }}>TOTAL TESTCASES:</span>
                  <span style={{ color: 'var(--accent)', fontWeight: 700, background: 'rgba(93, 141, 255, 0.1)', padding: '2px 8px', borderRadius: '6px', border: '1px solid var(--line)' }}>
                    {testcases.length}
                  </span>
                </div>
              </div>

              {/* Empty State when count is 0 */}
              {testcases.length === 0 && (
                <div className="glass-shell" style={{ padding: '80px 20px', textAlign: 'center', color: 'var(--muted)' }}>
                  <i className="fa-solid fa-list-check" style={{ fontSize: '36px', opacity: 0.3, marginBottom: '16px', display: 'block' }}></i>
                  <div style={{ fontSize: '14px', fontWeight: 700, color: '#fff', marginBottom: '4px' }}>No Testcases Created</div>
                  <div style={{ fontSize: '12px' }}>Click "+ Add Testcase Bar" below to start adding diagnostic inputs.</div>
                </div>
              )}

              {/* Expandable Testcase Bars List */}
              {testcases.length > 0 && (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
                  {testcases.map((tc, index) => (
                    <div key={tc.id} className="glass-shell">
                      
                      {/* Bar Header */}
                      <div
                        onClick={() => toggleTestcaseBar(index)}
                        style={{ padding: '16px 24px', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: 'rgba(18, 22, 32, 0.7)', borderBottom: tc.expanded ? '1px solid var(--line)' : 'none', userSelect: 'none' }}
                      >
                        <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                          <span style={{ fontSize: '10px', fontFamily: 'monospace', fontWeight: 700, color: 'var(--accent)', background: 'rgba(93, 141, 255, 0.12)', padding: '3px 8px', borderRadius: '6px', border: '1px solid var(--line)' }}>
                            {tc.id}
                          </span>
                          <span style={{ fontSize: '13px', fontWeight: 600, color: '#fff' }}>
                            {tc.formData.description ? tc.formData.description.slice(0, 50) : tc.title}
                          </span>
                          <span style={{ fontSize: '11px', color: 'var(--muted)', fontFamily: 'monospace' }}>
                            (${tc.formData.amount || "0.00"} · {tc.formData.category})
                          </span>
                        </div>

                        <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                          {tc.result && (
                            <span style={{
                              fontSize: '11px',
                              fontWeight: 700,
                              padding: '3px 10px',
                              borderRadius: '999px',
                              background: tc.result.decision === 'APPROVE' ? 'rgba(74, 222, 128, 0.15)' : 'rgba(251, 191, 36, 0.15)',
                              color: tc.result.decision === 'APPROVE' ? 'var(--signalGreen)' : 'var(--signalAmber)',
                              border: `1px solid ${tc.result.decision === 'APPROVE' ? 'rgba(74, 222, 128, 0.3)' : 'rgba(251, 191, 36, 0.3)'}`
                            }}>
                              {tc.result.decision} → {tc.result.target_role}
                            </span>
                          )}
                          <i className={`fa-solid fa-chevron-down`} style={{ fontSize: '11px', color: 'var(--muted)', transform: tc.expanded ? 'rotate(180deg)' : 'none', transition: 'transform 0.2s' }}></i>
                        </div>
                      </div>

                      {/* Bar Body */}
                      {tc.expanded && (
                        <div style={{ padding: '24px', display: 'grid', gridTemplateColumns: '1.2fr 0.8fr', gap: '24px', background: 'rgba(10, 14, 22, 0.5)' }}>
                          
                          {/* Inputs */}
                          <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                              <div className="field-group">
                                <label className="field-label">Employee Name</label>
                                <input
                                  type="text"
                                  className="field-input"
                                  value={tc.formData.employee_name}
                                  onChange={e => updateTestcaseField(index, 'employee_name', e.target.value)}
                                  placeholder="Alex Johnson"
                                />
                              </div>
                              <div className="field-group">
                                <label className="field-label">Employee ID</label>
                                <input
                                  type="text"
                                  className="field-input"
                                  value={tc.formData.employee_id}
                                  onChange={e => updateTestcaseField(index, 'employee_id', e.target.value)}
                                  placeholder="EMP-1001"
                                />
                              </div>
                            </div>

                            <div style={{ display: 'grid', gridTemplateColumns: '1.2fr 1fr 1fr', gap: '12px' }}>
                              <div className="field-group">
                                <label className="field-label">Category</label>
                                <select
                                  className="field-input"
                                  value={tc.formData.category}
                                  onChange={e => updateTestcaseField(index, 'category', e.target.value)}
                                >
                                  <option value="meal">Meals</option>
                                  <option value="hotel">Hotel</option>
                                  <option value="flight">Flight</option>
                                  <option value="ride">Ride / Taxi</option>
                                  <option value="equipment">Equipment</option>
                                  <option value="other">Other</option>
                                </select>
                              </div>
                              <div className="field-group">
                                <label className="field-label">Amount ($)</label>
                                <input
                                  type="number"
                                  className="field-input"
                                  style={{ fontWeight: 700 }}
                                  value={tc.formData.amount}
                                  onChange={e => updateTestcaseField(index, 'amount', e.target.value)}
                                  placeholder="0.00"
                                />
                              </div>
                              <div className="field-group">
                                <label className="field-label">Days Ago</label>
                                <input
                                  type="number"
                                  className="field-input"
                                  value={tc.formData.days_since_expense}
                                  onChange={e => updateTestcaseField(index, 'days_since_expense', parseInt(e.target.value) || 0)}
                                  placeholder="1"
                                />
                              </div>
                            </div>

                            <div className="field-group">
                              <label className="field-label">Description / Purpose</label>
                              <input
                                type="text"
                                className="field-input"
                                value={tc.formData.description}
                                onChange={e => updateTestcaseField(index, 'description', e.target.value)}
                                placeholder="e.g. Workstation purchase, blurry invoice, dinner with alcohol"
                              />
                            </div>

                            <button
                              type="button"
                              onClick={() => handleEvaluateTestcaseBar(index)}
                              disabled={tc.loading}
                              className="primary"
                              style={{ justifyContent: 'center', marginTop: '6px' }}
                            >
                              <i className={`fa-solid fa-play ${tc.loading ? 'fa-spin' : ''}`}></i>
                              <span>{tc.loading ? 'Evaluating Bar...' : 'Run Evaluation on this Bar'}</span>
                            </button>
                          </div>

                          {/* Result */}
                          <div style={{ padding: '20px', borderRadius: '16px', background: 'rgba(18, 22, 32, 0.7)', border: '1px solid var(--line)', display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
                            {!tc.result ? (
                              <div style={{ textAlign: 'center', color: 'var(--muted)', margin: 'auto' }}>
                                <i className="fa-solid fa-microchip" style={{ fontSize: '24px', opacity: 0.3, marginBottom: '8px', display: 'block' }}></i>
                                <span style={{ fontSize: '11px' }}>Click "Run Evaluation" to view output.</span>
                              </div>
                            ) : (
                              <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                                <div style={{
                                  padding: '10px 14px',
                                  borderRadius: '10px',
                                  display: 'flex',
                                  justifyContent: 'space-between',
                                  alignItems: 'center',
                                  background: tc.result.decision === 'APPROVE' ? 'rgba(74, 222, 128, 0.1)' : 'rgba(251, 191, 36, 0.1)',
                                  border: `1px solid ${tc.result.decision === 'APPROVE' ? 'rgba(74, 222, 128, 0.25)' : 'rgba(251, 191, 36, 0.25)'}`
                                }}>
                                  <span style={{ fontSize: '12px', fontWeight: 800, color: tc.result.decision === 'APPROVE' ? 'var(--signalGreen)' : 'var(--signalAmber)' }}>
                                    {tc.result.decision}
                                  </span>
                                  <span style={{ fontSize: '11px', color: 'var(--ink)' }}>→ {tc.result.target_role}</span>
                                </div>

                                {tc.result.escalation_question && (
                                  <div style={{ padding: '10px 12px', background: 'rgba(251, 191, 36, 0.05)', borderRadius: '10px', border: '1px solid rgba(251, 191, 36, 0.15)', fontSize: '11px', color: '#fef3c7' }}>
                                    "{tc.result.escalation_question}"
                                  </div>
                                )}

                                <div style={{ fontSize: '11px', color: 'var(--muted)', display: 'flex', flexDirection: 'column', gap: '4px' }}>
                                  <div><strong style={{ color: '#fff' }}>Reason:</strong> {tc.result.reason}</div>
                                  <div style={{ fontFamily: 'monospace', fontSize: '9px' }}>Ref: {tc.result.policy_reference}</div>
                                </div>
                              </div>
                            )}
                          </div>

                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}

              {/* Add Button strictly below the list */}
              <div>
                <button
                  type="button"
                  onClick={handleAddTestcase}
                  style={{
                    width: '100%',
                    padding: '16px',
                    borderRadius: '18px',
                    border: '1px dashed var(--line)',
                    background: 'rgba(18, 22, 32, 0.4)',
                    justifyContent: 'center',
                    color: 'var(--muted)',
                    fontSize: '12px'
                  }}
                  onMouseOver={e => e.currentTarget.style.borderColor = 'var(--accent)'}
                  onMouseOut={e => e.currentTarget.style.borderColor = 'var(--line)'}
                >
                  <i className="fa-solid fa-plus" style={{ color: 'var(--accent)' }}></i>
                  <span>Add Testcase Bar</span>
                </button>
              </div>

            </div>
          )}

        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  
  </script>
</body>
</html>
